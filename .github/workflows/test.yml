name: Test DUAT

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies and fixed process scanner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bzip2
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          curl -fsSLO https://github.com/restic/restic/releases/download/v0.19.1/SHA256SUMS
          grep '  restic_0.19.1_linux_amd64.bz2$' SHA256SUMS | sha256sum --check --status
          bunzip2 restic_0.19.1_linux_amd64.bz2
          sudo install -o root -g root -m 0755 restic_0.19.1_linux_amd64 /usr/local/bin/restic
          cd "$GITHUB_WORKSPACE"
          sudo install -D -o root -g root -m 0755 helpers/project-vault-active-users /usr/local/libexec/project-vault-active-users
          mkdir -p "$HOME/.cache/workflow-tmp"
          echo "TMPDIR=$HOME/.cache/workflow-tmp" >> "$GITHUB_ENV"
          restic version
      - name: Run isolated repository and offload tests
        run: python3 -m unittest discover -v
